name: DoT diagnostic
# diagnostic-generation: 4

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dot-diagnostic.yml"

jobs:
  test-dot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Railway bridge public health
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsS --max-time 15 https://dns-production-eebd.up.railway.app/_bridge/api/public | python3 -m json.tool

      - name: Public DNS resolution
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== getent ahosts ==="
          getent ahosts techs.huggy.bond || true
          echo
          echo "=== Python getaddrinfo ==="
          python3 - <<'PY'
          import socket
          host = "techs.huggy.bond"
          seen = set()
          for family, socktype, proto, canonname, sockaddr in socket.getaddrinfo(host, 853, type=socket.SOCK_STREAM):
              key = (family, sockaddr[0])
              if key in seen:
                  continue
              seen.add(key)
              print(("IPv6" if family == socket.AF_INET6 else "IPv4" if family == socket.AF_INET else str(family)), sockaddr[0])
          PY

      - name: TLS certificate and SNI
        shell: bash
        run: |
          set -euxo pipefail
          timeout 15 openssl s_client             -connect techs.huggy.bond:853             -servername techs.huggy.bond             -verify_hostname techs.huggy.bond             -verify_return_error             -brief </dev/null

      - name: Real DNS-over-TLS query
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import ipaddress
          import socket
          import ssl
          import struct

          HOST = "techs.huggy.bond"
          PORT = 853
          QNAME = "google.com"

          def encode_name(name):
              return b"".join(bytes([len(label)]) + label.encode("ascii") for label in name.split(".")) + b"\x00"

          def read_exact(sock, count):
              data = b""
              while len(data) < count:
                  chunk = sock.recv(count - len(data))
                  if not chunk:
                      raise RuntimeError(f"unexpected EOF after {len(data)}/{count} bytes")
                  data += chunk
              return data

          txid = 0x5A5A
          flags = 0x0100  # recursion desired
          query = struct.pack("!HHHHHH", txid, flags, 1, 0, 0, 0)
          query += encode_name(QNAME)
          query += struct.pack("!HH", 1, 1)  # A IN

          context = ssl.create_default_context()
          addresses = socket.getaddrinfo(HOST, PORT, type=socket.SOCK_STREAM)
          print("Resolved endpoints:")
          for family, _, _, _, sockaddr in addresses:
              print(" ", "IPv6" if family == socket.AF_INET6 else "IPv4", sockaddr[0])

          with socket.create_connection((HOST, PORT), timeout=10) as raw:
              print("TCP peer:", raw.getpeername())
              with context.wrap_socket(raw, server_hostname=HOST) as tls:
                  print("TLS:", tls.version(), tls.cipher()[0])
                  cert = tls.getpeercert()
                  print("Certificate subject:", cert.get("subject"))
                  print("Certificate SAN:", cert.get("subjectAltName"))
                  tls.sendall(struct.pack("!H", len(query)) + query)
                  response_len = struct.unpack("!H", read_exact(tls, 2))[0]
                  response = read_exact(tls, response_len)

          if len(response) < 12:
              raise RuntimeError("short DNS response")
          rid, rflags, qd, an, ns, ar = struct.unpack("!HHHHHH", response[:12])
          rcode = rflags & 0xF
          qr = (rflags >> 15) & 1
          ra = (rflags >> 7) & 1
          print(f"DNS response: bytes={len(response)} id=0x{rid:04x} qr={qr} rcode={rcode} qd={qd} an={an} ns={ns} ar={ar} ra={ra}")
          if rid != txid:
              raise RuntimeError(f"transaction ID mismatch: {rid:#x}")
          if qr != 1:
              raise RuntimeError("not a DNS response")
          if rcode != 0:
              raise RuntimeError(f"DNS RCODE was {rcode}")
          if an < 1:
              raise RuntimeError("DNS response had no answers")
          if ra != 1:
              raise RuntimeError("recursion is not available")
          print("REAL DOT QUERY: PASS")
          PY

      - name: Android 10-style Private DNS validation query
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          import random
          import socket
          import ssl
          import struct
          import string

          host = "techs.huggy.bond"
          alphabet = "abcdefhijklmnopqrstuvwxyzABCDEFHIJKLMNOPQRSTUVWXYZ0123456789"
          prefix = "".join(random.choice(alphabet) for _ in range(6))
          qname_text = prefix + "-dnsotls-ds.metric.gstatic.com"
          print("Android-style validation name:", qname_text)

          def encode_name(name):
              return b"".join(bytes([len(label)]) + label.encode("ascii") for label in name.split(".")) + b"\x00"

          txid = int.from_bytes(os.urandom(2), "big")
          # Android 10 uses RD=1 and QTYPE AAAA / QCLASS IN.
          query = struct.pack("!HHHHHH", txid, 0x0100, 1, 0, 0, 0)
          query += encode_name(qname_text)
          query += struct.pack("!HH", 28, 1)

          def read_exact(sock, n):
              out=b""
              while len(out) < n:
                  chunk=sock.recv(n-len(out))
                  if not chunk:
                      raise RuntimeError("EOF before complete DoT response")
                  out += chunk
              return out

          ctx=ssl.create_default_context()
          with socket.create_connection((host,853),timeout=10) as raw:
              with ctx.wrap_socket(raw,server_hostname=host) as tls:
                  tls.sendall(struct.pack("!H",len(query))+query)
                  size=struct.unpack("!H",read_exact(tls,2))[0]
                  response=read_exact(tls,size)

          rid, flags, qd, an, ns, ar = struct.unpack("!HHHHHH", response[:12])
          print(f"Android-style response: bytes={len(response)} id=0x{rid:04x} qd={qd} an={an} ns={ns} ar={ar} rcode={flags & 0xF}")
          if rid != txid:
              raise SystemExit("Android validation: transaction ID mismatch")
          if qd != 1:
              raise SystemExit("Android validation: QDCOUNT is not 1")
          print("ANDROID 10 VALIDATION PROBE: PASS")
          PY

      - name: Android 13 persistent and pipelined DoT stress
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import socket
          import ssl
          import struct
          import time

          HOST = "techs.huggy.bond"
          PORT = 853
          NAMES = [
              "youtube.com",
              "www.youtube.com",
              "youtubei.googleapis.com",
              "i.ytimg.com",
              "googlevideo.com",
              "beacons.gvt2.com",
              "googleapis.com",
          ]

          def encode_name(name):
              return b"".join(bytes([len(label)]) + label.encode("ascii") for label in name.split(".")) + b"\x00"

          def query(txid, name, qtype):
              msg = struct.pack("!HHHHHH", txid, 0x0100, 1, 0, 0, 0)
              msg += encode_name(name)
              msg += struct.pack("!HH", qtype, 1)
              return struct.pack("!H", len(msg)) + msg

          def read_exact(sock, count):
              data = b""
              while len(data) < count:
                  chunk = sock.recv(count - len(data))
                  if not chunk:
                      raise RuntimeError(f"EOF after {len(data)}/{count} bytes")
                  data += chunk
              return data

          def read_response(sock):
              size = struct.unpack("!H", read_exact(sock, 2))[0]
              data = read_exact(sock, size)
              if len(data) < 12:
                  raise RuntimeError("short DNS response")
              rid, flags, qd, an, ns, ar = struct.unpack("!HHHHHH", data[:12])
              if ((flags >> 15) & 1) != 1 or qd != 1:
                  raise RuntimeError(f"invalid DNS response id={rid:#x} flags={flags:#x} qd={qd}")
              return rid, flags & 0xF, an, len(data)

          def open_tls(version=None):
              ctx = ssl.create_default_context()
              if version is not None:
                  ctx.minimum_version = version
                  ctx.maximum_version = version
              raw = socket.create_connection((HOST, PORT), timeout=10)
              raw.settimeout(15)
              tls = ctx.wrap_socket(raw, server_hostname=HOST)
              return raw, tls

          # First prove both protocol versions that Android 13 may negotiate.
          for version in (ssl.TLSVersion.TLSv1_2, ssl.TLSVersion.TLSv1_3):
              raw, tls = open_tls(version)
              try:
                  tls.sendall(query(0x1100 + int(version), "youtube.com", 1))
                  rid, rcode, an, size = read_response(tls)
                  print(f"{tls.version()} single-query: id={rid:#x} rcode={rcode} answers={an} bytes={size}")
              finally:
                  tls.close()

          # Android reuses a DoT connection. Exercise many sequential requests over one TLS socket.
          raw, tls = open_tls()
          started = time.monotonic()
          try:
              print("Persistent connection negotiated:", tls.version(), tls.cipher()[0])
              for i in range(200):
                  name = NAMES[i % len(NAMES)]
                  qtype = 28 if i % 3 == 0 else 1
                  txid = 0x2000 + i
                  tls.sendall(query(txid, name, qtype))
                  rid, rcode, an, size = read_response(tls)
                  if rid != txid:
                      raise RuntimeError(f"sequential ID mismatch: sent={txid:#x} got={rid:#x}")
              print(f"PERSISTENT SEQUENTIAL DOT: PASS (200 queries in {time.monotonic()-started:.2f}s)")
          finally:
              tls.close()

          # Send a burst without waiting for each answer, matching Android's ability to multiplex
          # outstanding DNS transactions over a single RFC 7858 TLS stream.
          raw, tls = open_tls()
          try:
              expected = set()
              frames = []
              for i in range(128):
                  txid = 0x4000 + i
                  expected.add(txid)
                  name = NAMES[i % len(NAMES)]
                  qtype = 28 if i % 2 == 0 else 1
                  frames.append(query(txid, name, qtype))
              tls.sendall(b"".join(frames))
              seen = set()
              for _ in range(len(expected)):
                  rid, rcode, an, size = read_response(tls)
                  if rid not in expected:
                      raise RuntimeError(f"unexpected pipelined response ID {rid:#x}")
                  if rid in seen:
                      raise RuntimeError(f"duplicate pipelined response ID {rid:#x}")
                  seen.add(rid)
              missing = expected - seen
              if missing:
                  raise RuntimeError(f"missing {len(missing)} pipelined responses")
              print("PIPELINED DOT: PASS (128 outstanding queries)")
          finally:
              tls.close()
          PY

      - name: Verify Android 13 compatible certificate chain
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          timeout 15 openssl s_client -connect techs.huggy.bond:853 -servername techs.huggy.bond -showcerts </dev/null >"$tmp/chain.txt" 2>"$tmp/openssl.err"
          cat "$tmp/openssl.err"

          python3 - "$tmp/chain.txt" "$tmp" <<'PY'
          import pathlib, re, sys
          src = pathlib.Path(sys.argv[1]).read_text()
          out = pathlib.Path(sys.argv[2])
          blocks = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", src, re.S)
          print("Served chain certificate count:", len(blocks))
          for i, block in enumerate(blocks, 1):
              (out / f"cert-{i}.pem").write_text(block + "\n")
          if len(blocks) < 3:
              raise SystemExit("Android 13 compatibility chain is incomplete: expected leaf + ZeroSSL intermediate + USERTrust-cross-signed R46")
          PY

          for cert in "$tmp"/cert-*.pem; do
            echo "=== $(basename "$cert") ==="
            openssl x509 -in "$cert" -noout -subject -issuer -dates -fingerprint -sha256
          done

          cert3_info="$(openssl x509 -in "$tmp/cert-3.pem" -noout -subject -issuer -fingerprint -sha256)"
          echo "$cert3_info"
          echo "$cert3_info" | grep -q "subject=.*Sectigo Public Server Authentication Root R46"
          echo "$cert3_info" | grep -q "issuer=.*USERTrust RSA Certification Authority"
          echo "$cert3_info" | grep -qi "92:F3:51:BF:3D:54:16:4D:FA:8D:D8:F9:E1:13:9D:31:50:34:97:86:48:5D:2B:9E:EC:D0:0E:29:71:C1:E6:C5"

          curl -fsSL https://crt.sectigo.com/USERTrustRSACertificationAuthority.crt -o "$tmp/usertrust.der"
          openssl x509 -inform DER -in "$tmp/usertrust.der" -out "$tmp/usertrust.pem"
          cat "$tmp/cert-2.pem" "$tmp/cert-3.pem" > "$tmp/untrusted.pem"
          openssl verify -no-CApath -no-CAstore -CAfile "$tmp/usertrust.pem" -untrusted "$tmp/untrusted.pem" "$tmp/cert-1.pem"
          echo "ANDROID 13 USERTRUST CHAIN: PASS"

      - name: IPv4-forced DoT query
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import socket, ssl, struct
          host = "techs.huggy.bond"
          ip = socket.gethostbyname(host)
          print("IPv4 target:", ip)
          qname = b"".join(bytes([len(x)]) + x.encode() for x in "example.com".split(".")) + b"\x00"
          msg = struct.pack("!HHHHHH", 0x4242, 0x0100, 1, 0, 0, 0) + qname + struct.pack("!HH", 1, 1)
          ctx = ssl.create_default_context()
          with socket.create_connection((ip, 853), timeout=10) as raw:
              with ctx.wrap_socket(raw, server_hostname=host) as s:
                  s.sendall(struct.pack("!H", len(msg)) + msg)
                  hdr = s.recv(2)
                  if len(hdr) != 2:
                      raise SystemExit("No DoT length prefix returned")
                  n = struct.unpack("!H", hdr)[0]
                  data = b""
                  while len(data) < n:
                      part = s.recv(n-len(data))
                      if not part:
                          raise SystemExit("EOF before full DNS response")
                      data += part
          _, flags, _, an, _, _ = struct.unpack("!HHHHHH", data[:12])
          print("IPv4 DoT response bytes:", len(data), "answers:", an, "rcode:", flags & 0xF)
          if (flags & 0xF) != 0 or an < 1:
              raise SystemExit("IPv4 DoT query failed")
          print("IPV4 DOT QUERY: PASS")
          PY
