services:
  dns-server:
    build: .
    container_name: dns-server
    restart: unless-stopped
    ports:
      - "10000:10000/tcp"
      # FRP normally publishes DNS/DoT. For direct local testing you may also map:
      # - "53:53/udp"
      # - "53:53/tcp"
      # - "853:853/tcp"
      # - "853:853/udp"
    volumes:
      - dns-data:/data

volumes:
  dns-data:
