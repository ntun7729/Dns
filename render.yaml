services:
  - type: web
    name: dns-dashboard
    runtime: docker
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # Process bootstrap only. Operational DNS/FRPC/TLS/auth settings are
      # created and edited from the web dashboard.
      - key: APP_ENV
        value: "production"
      - key: PORT
        value: "10000"
